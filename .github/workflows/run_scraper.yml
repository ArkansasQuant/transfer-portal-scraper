name: Run Transfer Portal Scraper

on:
  workflow_dispatch:
    inputs:
      year_range:
        description: 'Years: "2024-2026", "2021-2023", "all", "2021,2022", or single "2024"'
        required: false
        default: '2021,2022'
        type: string
      test_mode:
        description: 'Test Mode (true = 50 players per year, false = full scrape)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      validation_sample:
        description: 'Number of players to validate for accuracy'
        required: false
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '50'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Run Scraper
      env:
        YEAR_RANGE: ${{ github.event.inputs.year_range }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: python scraper.py

    - name: Validate Accuracy
      if: always()
      run: |
        if ls *FULL*.csv 1> /dev/null 2>&1; then
          python validate_accuracy.py *FULL*.csv ${{ github.event.inputs.validation_sample }} || true
        elif ls *TEST*.csv 1> /dev/null 2>&1; then
          python validate_accuracy.py *TEST*.csv ${{ github.event.inputs.validation_sample }} || true
        fi

    - name: Upload CSV Data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CSV_Output
        path: |
          *.csv
        retention-days: 90

    - name: Upload Diagnostic Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Diagnostics
        path: |
          diagnostics_report.txt
          diagnostic_html/*.html
        retention-days: 30
